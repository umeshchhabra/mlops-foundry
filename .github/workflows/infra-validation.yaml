name: Infrastructure validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install YAML linter
        run: python -m pip install --disable-pip-version-check yamllint==1.35.1

      - name: Lint YAML
        run: yamllint -d relaxed .

      - name: Render platform Kustomize
        run: |
          kubectl kustomize infra/platform/base > /tmp/platform.yaml
          test -s /tmp/platform.yaml

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem scripts,health -Filter *.ps1 -Recurse
          foreach ($file in $files) {
            [scriptblock]::Create((Get-Content $file.FullName -Raw)) | Out-Null
            Write-Host "Parsed $($file.FullName)"
          }

      - name: Check shell script syntax
        run: |
          sed -i 's/\r$//' scripts/bootstrap-kind-linux.sh
          bash -n scripts/bootstrap-kind-linux.sh

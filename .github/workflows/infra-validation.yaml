name: Infrastructure validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install YAML linter
        run: python -m pip install --disable-pip-version-check yamllint==1.35.1

      - name: Lint YAML
        run: yamllint -d relaxed .

      - name: Render platform Kustomize
        run: |
          kubectl kustomize infra/platform/base > /tmp/platform.yaml
          test -s /tmp/platform.yaml

      - name: Check portable entrypoints
        run: |
          legacy_files="$(find . -path './.git' -prune -o -type f \( -name '*.[Pp][Ss]1' -o -name '*.[Pp][Ss][Mm]1' \) -print -quit)"
          if [[ -n "$legacy_files" ]]; then
            printf 'Unexpected legacy script: %s\n' "$legacy_files" >&2
            exit 1
          fi
          python3 -c 'from pathlib import Path; [compile(path.read_text(encoding="utf-8"), str(path), "exec") for root in ("scripts", "health") for path in Path(root).rglob("*.py")]'

      - name: Check shell script syntax
        run: |
          find scripts health infra/platform/backup -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

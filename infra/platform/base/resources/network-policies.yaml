apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: mlops-default-deny, namespace: mlops }
spec: { podSelector: {}, policyTypes: [Ingress, Egress] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: mlops-allow-intra, namespace: mlops }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: [{ from: [{ podSelector: {} }] }]
  egress: [{ to: [{ podSelector: {} }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: mlops-allow-dns, namespace: mlops }
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: mlops-allow-local-nodeport, namespace: mlops }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: [{ from: [{ ipBlock: { cidr: 0.0.0.0/0 } }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: prometheus-allow-cert-manager-metrics, namespace: mlops }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/component: server }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: cert-manager } }
      ports: [{ protocol: TCP, port: 9402 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: feature-projects-allow-redis, namespace: mlops }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: redis } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { mlops-foundry.io/feature-client: 'true' } }
      ports: [{ protocol: TCP, port: 6379 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: feature-projects-allow-minio, namespace: mlops }
spec:
  podSelector: { matchLabels: { app: minio } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { mlops-foundry.io/feature-client: 'true' } }
      ports: [{ protocol: TCP, port: 9000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: prometheus-allow-coredns-metrics, namespace: mlops }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/component: server }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports: [{ protocol: TCP, port: 9153 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: prometheus-allow-kserve-metrics, namespace: mlops }
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: prometheus, app.kubernetes.io/component: server }
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kserve } }
          podSelector: { matchLabels: { control-plane: kserve-controller-manager } }
      ports: [{ protocol: TCP, port: 8443 }]

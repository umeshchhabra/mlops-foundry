apiVersion: v1
kind: ServiceAccount
metadata: { name: postgres, namespace: mlops }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: minio, namespace: mlops }
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: mlflow, namespace: mlops }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: postgres, namespace: mlops, labels: { app: postgres } }
spec:
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      serviceAccountName: postgres
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
            - { name: POSTGRES_DB, value: mlflow }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: platform-secrets, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: POSTGRES_PASSWORD } }
          ports: [{ containerPort: 5432 }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: '1', memory: 1Gi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: postgres-pvc } }]
---
apiVersion: v1
kind: Service
metadata: { name: postgres, namespace: mlops }
spec: { type: ClusterIP, selector: { app: postgres }, ports: [{ name: postgres, port: 5432, targetPort: 5432 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: mlops, labels: { app: minio } }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      serviceAccountName: minio
      containers:
        - name: minio
          image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
          args: [server, /data, --console-address, ':9001']
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: platform-secrets, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: MINIO_ROOT_PASSWORD } }
          ports: [{ containerPort: 9000 }, { containerPort: 9001 }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: '1', memory: 1Gi } }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: minio-pvc } }]
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: mlops }
spec:
  type: NodePort
  selector: { app: minio }
  ports: [{ name: api, port: 9000, targetPort: 9000, nodePort: 32000 }, { name: console, port: 9001, targetPort: 9001, nodePort: 32001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mlflow, namespace: mlops, labels: { app: mlflow } }
spec:
  replicas: 1
  selector: { matchLabels: { app: mlflow } }
  template:
    metadata: { labels: { app: mlflow } }
    spec:
      serviceAccountName: mlflow
      containers:
        - name: mlflow
          image: mlflow:3.4.0-psycopg2
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args: ['exec mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri "$MLFLOW_DB_URI" --default-artifact-root s3://mlflow-artifacts']
          env:
            - { name: MLFLOW_S3_ENDPOINT_URL, value: http://minio:9000 }
            - name: MLFLOW_DB_URI
              valueFrom: { secretKeyRef: { name: platform-secrets, key: MLFLOW_DB_URI } }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: platform-secrets, key: AWS_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: platform-secrets, key: AWS_SECRET_ACCESS_KEY } }
          ports: [{ containerPort: 5000 }]
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: '1', memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: mlflow, namespace: mlops }
spec: { type: NodePort, selector: { app: mlflow }, ports: [{ name: http, port: 5000, targetPort: 5000, nodePort: 30500 }] }

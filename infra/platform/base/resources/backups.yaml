apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: platform-backups-pvc
  namespace: mlops
  labels: { app.kubernetes.io/part-of: mlops-foundry, app.kubernetes.io/component: backup }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: backup-storage-initialize
  namespace: mlops
  # Keep the first consumer in wave 0 with the PVC. Kind's standard storage
  # class uses WaitForFirstConsumer, so a later wave would deadlock binding.
  annotations: { argocd.argoproj.io/sync-wave: "0" }
spec:
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: { seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: initialize
          image: alpine:3.20
          command: [/bin/sh, -ec]
          args: [mkdir -p /backup/postgres /backup/minio]
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { cpu: 50m, memory: 64Mi } }
          volumeMounts: [{ name: backups, mountPath: /backup }]
      volumes: [{ name: backups, persistentVolumeClaim: { claimName: platform-backups-pvc } }]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: mlops
spec:
  schedule: "17 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext: { seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: pg-dump
              image: postgres:15-alpine
              env:
                - name: PGHOST
                  value: postgres
                - name: PGUSER
                  valueFrom: { secretKeyRef: { name: platform-secrets, key: POSTGRES_USER } }
                - name: PGPASSWORD
                  valueFrom: { secretKeyRef: { name: platform-secrets, key: POSTGRES_PASSWORD } }
              command: [/bin/sh, -ec]
              securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
              args:
                - |
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  mkdir -p /backup/postgres
                  pg_dumpall | gzip > "/backup/postgres/postgres-${stamp}.sql.gz"
                  find /backup/postgres -type f -mtime +14 -delete
              volumeMounts: [{ name: backups, mountPath: /backup }]
              resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          volumes: [{ name: backups, persistentVolumeClaim: { claimName: platform-backups-pvc } }]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: minio-backup
  namespace: mlops
spec:
  schedule: "47 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext: { seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: mc-mirror
              image: quay.io/minio/mc:latest
              env:
                - name: MINIO_ROOT_USER
                  valueFrom: { secretKeyRef: { name: platform-secrets, key: MINIO_ROOT_USER } }
                - name: MINIO_ROOT_PASSWORD
                  valueFrom: { secretKeyRef: { name: platform-secrets, key: MINIO_ROOT_PASSWORD } }
                - { name: MC_CONFIG_DIR, value: /tmp/mc }
              command: [/bin/sh, -ec]
              securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
              args:
                - |
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  mc --config-dir "$MC_CONFIG_DIR" alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
                  mkdir -p "/backup/minio/${stamp}"
                  mc --config-dir "$MC_CONFIG_DIR" mirror --overwrite local "/backup/minio/${stamp}"
              volumeMounts: [{ name: backups, mountPath: /backup }]
              resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          volumes: [{ name: backups, persistentVolumeClaim: { claimName: platform-backups-pvc } }]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: redis-backup
  namespace: mlops
spec:
  schedule: "7 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext: { seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: redis-backup
              image: redis:7.4-alpine
              env:
                - name: REDISCLI_AUTH
                  valueFrom: { secretKeyRef: { name: platform-secrets, key: REDIS_PASSWORD } }
              command: [/bin/sh, -ec]
              args:
                - |
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  mkdir -p /backup/redis
                  redis-cli -h redis --rdb "/backup/redis/redis-${stamp}.rdb"
              volumeMounts: [{ name: backups, mountPath: /backup }]
              resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: 250m, memory: 256Mi } }
              securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumes: [{ name: backups, persistentVolumeClaim: { claimName: platform-backups-pvc } }]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-retention
  namespace: mlops
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext: { seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: cleanup
              image: alpine:3.20
              command: [/bin/sh, -ec]
              securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
              args:
                - |
                  find /backup/postgres -type f -mtime +14 -delete
                  find /backup/minio -mindepth 1 -maxdepth 1 -type d -mtime +14 -exec rm -rf {} +
                  find /backup/redis -type f -mtime +14 -delete
              volumeMounts: [{ name: backups, mountPath: /backup }]
              resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 100m, memory: 128Mi } }
          volumes: [{ name: backups, persistentVolumeClaim: { claimName: platform-backups-pvc } }]

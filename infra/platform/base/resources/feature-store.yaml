apiVersion: v1
kind: ServiceAccount
metadata: { name: redis, namespace: mlops }
automountServiceAccountToken: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: mlops
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/component: feature-store }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 2Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: mlops
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/component: feature-store }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: redis } }
  strategy: { type: Recreate }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/component: feature-store }
      annotations: { prometheus.io/scrape: 'true', prometheus.io/port: '9121' }
    spec:
      serviceAccountName: redis
      securityContext: { runAsNonRoot: true, runAsUser: 999, runAsGroup: 999, fsGroup: 999, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: redis
          image: redis:7.4-alpine
          command: [/bin/sh, -ec]
          args: ['exec redis-server --appendonly yes --save 60 1 --requirepass "$REDIS_PASSWORD"']
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: REDIS_PASSWORD } }
            - name: REDISCLI_AUTH
              valueFrom: { secretKeyRef: { name: platform-secrets, key: REDIS_PASSWORD } }
          ports: [{ name: redis, containerPort: 6379 }]
          readinessProbe: { exec: { command: [/bin/sh, -ec, 'redis-cli ping | grep -q PONG'] }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { exec: { command: [/bin/sh, -ec, 'redis-cli ping | grep -q PONG'] }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: data, mountPath: /data }]
        - name: metrics
          image: oliver006/redis_exporter:v1.67.0
          env:
            - { name: REDIS_ADDR, value: redis://localhost:6379 }
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: REDIS_PASSWORD } }
          ports: [{ name: metrics, containerPort: 9121 }]
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 100m, memory: 128Mi } }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: redis-pvc } }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: mlops
  labels: { app.kubernetes.io/name: redis, app.kubernetes.io/component: feature-store }
  annotations: { prometheus.io/scrape: 'true', prometheus.io/port: '9121' }
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis }
    - { name: metrics, port: 9121, targetPort: metrics }

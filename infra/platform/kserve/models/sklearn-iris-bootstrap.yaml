apiVersion: batch/v1
kind: Job
metadata:
  name: sklearn-iris-bootstrap
  namespace: models
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: kserve-model
      restartPolicy: Never
      containers:
        - name: build-and-upload
          image: python:3.11-slim
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: kserve-minio-storage, key: AWS_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: kserve-minio-storage, key: AWS_SECRET_ACCESS_KEY } }
            - { name: S3_ENDPOINT, value: http://minio.mlops.svc.cluster.local:9000 }
          command: [/bin/sh, -ec]
          args:
            - |
              pip install --no-cache-dir --disable-pip-version-check boto3==1.35.54 joblib==1.4.2 scikit-learn==1.5.2
              python - <<'PY'
              import os
              import boto3
              import joblib
              from sklearn.datasets import load_iris
              from sklearn.linear_model import LogisticRegression

              X, y = load_iris(return_X_y=True)
              model = LogisticRegression(max_iter=1000).fit(X, y)
              artifact = '/tmp/model.joblib'
              joblib.dump(model, artifact)

              client = boto3.client(
                  's3', endpoint_url=os.environ['S3_ENDPOINT'],
                  aws_access_key_id=os.environ['AWS_ACCESS_KEY_ID'],
                  aws_secret_access_key=os.environ['AWS_SECRET_ACCESS_KEY'],
                  region_name='us-east-1')
              bucket = 'models'
              try:
                  client.head_bucket(Bucket=bucket)
              except Exception:
                  client.create_bucket(Bucket=bucket)
              client.upload_file(artifact, bucket, 'sklearn-iris/model.joblib')
              print('Uploaded s3://models/sklearn-iris/model.joblib')
              PY
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }

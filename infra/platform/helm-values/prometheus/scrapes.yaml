# Explicit jobs keep the protected KServe endpoint out of anonymous discovery.
# The default chart discovery for nodes and annotated exporters is retained.
serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: prometheus
        static_configs: [{ targets: ['localhost:9090'] }]
      - job_name: kubernetes-apiservers
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config: { ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
        static_configs: [{ targets: ['kubernetes.default.svc:443'] }]
      - job_name: kubernetes-nodes
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config: { ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - { action: labelmap, regex: '__meta_kubernetes_node_label_(.+)' }
          - { target_label: __address__, replacement: 'kubernetes.default.svc:443' }
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics
          - { source_labels: [__meta_kubernetes_node_name], target_label: node }
      - job_name: kubernetes-nodes-cadvisor
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config: { ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt }
        kubernetes_sd_configs: [{ role: node }]
        relabel_configs:
          - { action: labelmap, regex: '__meta_kubernetes_node_label_(.+)' }
          - { target_label: __address__, replacement: 'kubernetes.default.svc:443' }
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - { source_labels: [__meta_kubernetes_node_name], target_label: node }
      - job_name: kubernetes-service-endpoints
        honor_labels: true
        kubernetes_sd_configs: [{ role: endpoints }]
        relabel_configs:
          - { source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape], action: keep, regex: 'true' }
          - source_labels: [__meta_kubernetes_namespace, __meta_kubernetes_service_name]
            action: drop
            regex: kserve;kserve-controller-manager-metrics-service
          - { source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scheme], target_label: __scheme__, regex: '(https?)' }
          - { source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path], target_label: __metrics_path__, regex: '(.+)' }
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            target_label: __address__
            regex: '(.+?)(?::\d+)?;(\d+)'
            replacement: '$1:$2'
          - { source_labels: [__meta_kubernetes_namespace], target_label: namespace }
          - { source_labels: [__meta_kubernetes_service_name], target_label: service }
          - { source_labels: [__meta_kubernetes_pod_node_name], target_label: node }
      - job_name: kubernetes-pods
        honor_labels: true
        kubernetes_sd_configs: [{ role: pod }]
        relabel_configs:
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: 'true' }
          - { source_labels: [__meta_kubernetes_pod_phase], action: drop, regex: 'Pending|Succeeded|Failed|Completed' }
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scheme], target_label: __scheme__, regex: '(https?)' }
          - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], target_label: __metrics_path__, regex: '(.+)' }
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            target_label: __address__
            regex: '(.+);(\d+)'
            replacement: '$1:$2'
          - { source_labels: [__meta_kubernetes_namespace], target_label: namespace }
          - { source_labels: [__meta_kubernetes_pod_name], target_label: pod }
          - { action: labelmap, regex: '__meta_kubernetes_pod_label_(.+)' }
          - { source_labels: [__meta_kubernetes_pod_node_name], target_label: node }
      - job_name: prometheus-pushgateway
        honor_labels: true
        static_configs: [{ targets: ['prometheus-prometheus-pushgateway.mlops.svc:9091'] }]
      - job_name: kserve-controller
        scheme: https
        # KServe's RBAC proxy generates a self-signed serving certificate.
        # Local lab exception only: authentication stays enabled, and this token
        # is sent solely to the fixed in-cluster KServe metrics service.
        tls_config: { insecure_skip_verify: true }
        authorization:
          type: Bearer
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        static_configs:
          - targets: ['kserve-controller-manager-metrics-service.kserve.svc:8443']

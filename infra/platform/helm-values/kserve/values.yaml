kserve:
  # The chart uses Helm's `default`, which considers false empty. Keep the
  # global switch off and opt into the two resources required by KServe.
  createSharedResources: false
  inferenceServiceConfig: { enabled: true }
  certManager: { enabled: true }
  # Optional extension point; not needed for built-in runtimes using MinIO.
  # Disabling it avoids granting Argo CD an extra cluster-scoped permission.
  storagecontainer: { enabled: false }
  controller:
    deploymentMode: Standard
    # No ingress controller is part of this local stack yet. InferenceServices
    # remain reachable through their generated ClusterIP service/port-forward.
    gateway:
      disableIngressCreation: true
    resources:
      requests: { cpu: 100m, memory: 300Mi }
      limits: { cpu: 500m, memory: 512Mi }
  storage:
    s3:
      endpoint: http://minio.mlops.svc.cluster.local:9000
      useHttps: "0"
      region: us-east-1
      verifySSL: "0"
      useVirtualBucket: "0"

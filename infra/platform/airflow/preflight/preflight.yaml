apiVersion: batch/v1
kind: Job
metadata:
  name: airflow-preflight
  namespace: mlops
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 4
  template:
    metadata: { labels: { app.kubernetes.io/name: airflow-preflight } }
    spec:
      restartPolicy: OnFailure
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000 }
      containers:
        - name: create-airflow-database
          image: postgres:15-alpine
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          env:
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: POSTGRES_PASSWORD } }
            - name: AIRFLOW_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: AIRFLOW_DB_PASSWORD } }
          command: [sh, -ec]
          args:
            - |
              psql -h postgres -U mlflow -tc "SELECT 1 FROM pg_database WHERE datname = 'airflow'" | grep -q 1 || psql -h postgres -U mlflow -c 'CREATE DATABASE airflow;'
              psql -h postgres -U mlflow -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_catalog.pg_user WHERE usename = 'airflow') THEN CREATE USER airflow WITH ENCRYPTED PASSWORD '$AIRFLOW_DB_PASSWORD'; END IF; END \$\$;"
              psql -h postgres -U mlflow -c 'GRANT ALL PRIVILEGES ON DATABASE airflow TO airflow;'
        - name: create-log-bucket
          image: minio/mc:RELEASE.2025-08-13T08-35-41Z
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] }, readOnlyRootFilesystem: true }
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: platform-secrets, key: MINIO_ROOT_USER } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: platform-secrets, key: MINIO_ROOT_PASSWORD } }
            # Kubernetes expands only variables declared earlier in this list.
            - name: MC_HOST_minio
              value: http://$(MINIO_ROOT_USER):$(MINIO_ROOT_PASSWORD)@minio:9000
          command: [sh, -ec]
          args: ["mc mb --ignore-existing minio/airflow-logs"]

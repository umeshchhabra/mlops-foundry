apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mlops-bootstrap
  namespace: argocd
spec:
  description: Allows the root application to manage only Argo CD application definitions.
  sourceRepos:
    - https://github.com/umeshchhabra/mlops-foundry.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
    - group: argoproj.io
      kind: AppProject

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kserve-models
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "7" }
spec:
  project: mlops-platform
  source:
    repoURL: https://github.com/umeshchhabra/mlops-foundry.git
    targetRevision: main
    path: infra/platform/kserve/models
  destination: { server: https://kubernetes.default.svc, namespace: models }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    retry:
      limit: 10
      backoff: { duration: 5s, factor: 2, maxDuration: 1m }

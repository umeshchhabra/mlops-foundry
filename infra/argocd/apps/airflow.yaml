apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airflow
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: mlops-platform
  sources:
    - repoURL: https://airflow.apache.org
      chart: airflow
      targetRevision: 1.22.0
      helm:
        releaseName: airflow
        valueFiles: ["$values/infra/platform/helm-values/airflow/values.yaml"]
    - repoURL: https://github.com/umeshchhabra/mlops-foundry.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/umeshchhabra/mlops-foundry.git
      targetRevision: main
      path: infra/platform/airflow/preflight
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]

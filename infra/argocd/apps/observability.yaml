apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: mlops-platform
  source:
    repoURL: https://github.com/umeshchhabra/mlops-foundry.git
    targetRevision: main
    path: infra/platform/helm-values/observability
  destination:
    server: https://kubernetes.default.svc
    namespace: mlops

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: mlops-platform
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      targetRevision: 27.39.0
      helm:
        valueFiles: ["$values/infra/platform/helm-values/prometheus/values.yaml"]
    - repoURL: https://github.com/umeshchhabra/mlops-foundry.git
      targetRevision: main
      ref: values
  destination: { server: https://kubernetes.default.svc, namespace: mlops }
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
